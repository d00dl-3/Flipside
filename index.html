<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flipside</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flipside">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1219">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>
<style>
/* Layout: iPad split view — library sidebar left, content right, transport bar docked along the bottom like a tape deck. */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --hover:#E2E7EE; --ink:#141A26; --muted:#5D6677; --line:#D5DBE4;
  --accent:#0C8C7D; --accent-ink:#FFFFFF; --accent-soft:#D3EEEA; --warm:#C77A12; --warm-soft:#F8E8CF; --danger:#C2392F;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1219; --panel:#161C26; --hover:#1F2734; --ink:#E8ECF2; --muted:#8B95A7; --line:#262F3E;
  --accent:#2EC4AF; --accent-ink:#04201C; --accent-soft:#123A36; --warm:#EDB052; --warm-soft:#3A2C14; --danger:#F06B5F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1219; --panel:#161C26; --hover:#1F2734; --ink:#E8ECF2; --muted:#8B95A7; --line:#262F3E;
  --accent:#2EC4AF; --accent-ink:#04201C; --accent-soft:#123A36; --warm:#EDB052; --warm-soft:#3A2C14; --danger:#F06B5F; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
svg{display:block}
.app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}

/* Sidebar */
.side{grid-row:1;grid-column:1;border-right:1px solid var(--line);padding-block:22px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent) 0 50%,var(--warm) 50% 100%);position:relative;flex:none}
.brand i::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;padding:0 12px 6px}
.lbl button{color:var(--accent);font-size:20px;line-height:1;letter-spacing:0;width:28px;height:28px;border-radius:8px}
.lbl button:hover{background:var(--hover)}
.pls button{font-weight:500}
.pls .src{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted)}
.store{margin-top:auto;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.store b{display:block;color:var(--ink);font-family:var(--mono);font-weight:500;font-size:14px}
.side-wide{display:contents}

/* Main */
.main{grid-row:1;grid-column:2;overflow-y:auto;padding-block:28px 40px;padding-left:32px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;margin-bottom:20px}
.head .grow{flex:1 1 260px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:-.025em;line-height:1.05;margin:4px 0 6px;text-wrap:balance;overflow-wrap:anywhere}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;background:var(--panel);border:1px solid var(--line);min-height:42px}
.btn:hover{background:var(--hover)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search svg{width:18px;height:18px;color:var(--muted)}
.seg{display:inline-flex;background:var(--hover);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.sel{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seglabel{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto 52px 36px;align-items:center;gap:14px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:0}
.row:hover{background:var(--hover)}
.row.on .t{color:var(--accent)}
.row .n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row.on .n{color:var(--accent)}
.art{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--hover)}
.meta{min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.kind{font-size:12px;font-weight:600;color:var(--muted);padding:0 12px}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--hover);color:var(--ink)}
.icon svg{width:20px;height:20px}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warm-soft);color:var(--warm);vertical-align:1px}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.row.missing{cursor:default}
.row.missing .art{opacity:.45}
.row.missing .t{color:var(--muted)}
.miss{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.card .cv{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--hover)}
.card .cv img{width:100%;height:100%;object-fit:cover}
.card .cv .play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card .cv .play svg{width:20px;height:20px}
.card .t{font-size:15px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic img{width:100%;height:100%;object-fit:cover}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:32px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{color:var(--ink)}
.note{background:var(--warm-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.note b{color:var(--warm)}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}

/* Import page */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel p{margin:0;color:var(--muted);max-width:62ch}
.panel textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;resize:vertical;font-family:var(--mono);font-size:13px}
.panel code{font-family:var(--mono);font-size:13px;background:var(--hover);padding:1px 6px;border-radius:6px;user-select:all}
.why{margin-top:24px;max-width:70ch;color:var(--muted)}
.why h2{color:var(--ink)}

/* Now playing */
.np{grid-row:1;grid-column:1/-1;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding-block:16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:0}
.np-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 0}
.stage video{width:100%;height:100%;max-height:100%;background:#000;border-radius:16px;object-fit:contain}
.stage .big{height:min(100%,58vw);aspect-ratio:1;max-width:100%;border-radius:20px;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.np-meta{text-align:center}
.np-meta .t{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:800;white-space:normal}
.np-meta .a{font-size:15px;white-space:normal}

/* Transport bar */
.bar{grid-row:2;grid-column:1/-1;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.now .art{width:52px;height:52px}
.ctr{display:flex;flex-direction:column;gap:4px;min-width:0}
.btns{display:flex;justify-content:center;align-items:center;gap:10px}
.btns .icon.on{color:var(--accent)}
.btns .icon{position:relative}
.btns .icon .one{position:absolute;font-size:9px;font-weight:800;top:6px;right:5px;color:var(--accent)}
.pp{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.pp svg{width:22px;height:22px}
.seek{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek input{flex:1;min-width:0;accent-color:var(--accent);height:20px}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border-radius:18px;width:min(440px,100%);max-height:80vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet .opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;text-align:left;font-weight:600;width:100%}
.sheet .opt:hover{background:var(--hover)}
.sheet .opt svg{width:20px;height:20px;flex:none}
.sheet .opt.danger{color:var(--danger)}
.sheet label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sheet input[type=text]{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.sheet .row{grid-template-columns:44px minmax(0,1fr);padding:6px}
.sheet .row .art{width:44px;height:44px}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .side{grid-row:1;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;gap:14px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{font-size:18px}
  .nav{flex-direction:row}
  .side-wide{display:none}
  .main{grid-row:2;grid-column:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:20px 32px}
  .np{grid-row:1/3}
  .bar{grid-row:3;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
  .ctr{grid-column:1/-1;grid-row:2}
  .right .seg{display:none}
}
@media (max-width:520px){
  .row{grid-template-columns:44px minmax(0,1fr) auto 32px;gap:10px}
  .row .n,.row .dur{display:none}
  .row .art{width:44px;height:44px}
  .nav button span{display:none}
}
@media (prefers-reduced-motion: no-preference){
  .pp,.btn,.row,.card .cv img{transition:transform .15s ease, background-color .15s ease}
  .card:hover .cv img{transform:scale(1.03)}
  .pp:active{transform:scale(.94)}
}
</style>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><i aria-hidden="true"></i>Flipside</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-wide">
      <div>
        <div class="lbl">Playlists <button id="newpl" aria-label="New playlist">+</button></div>
        <div class="nav pls" id="pls"></div>
      </div>
      <div class="store" id="store"></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <section class="np" id="np" hidden aria-label="Now playing">
    <div class="np-top">
      <button class="btn sm" id="npclose">Close</button>
      <div class="seg" id="npmode"></div>
      <button class="btn sm" id="npfull">Full screen</button>
    </div>
    <div class="stage" id="stage">
      <video id="vid" playsinline webkit-playsinline preload="auto" hidden></video>
      <img class="big" id="bigart" alt="" hidden>
    </div>
    <div class="np-meta"><div class="t" id="npt"></div><div class="a" id="npa"></div></div>
  </section>
  <footer class="bar" id="bar">
    <button class="now" id="now" aria-label="Open now playing">
      <img class="art" id="barart" alt="">
      <div class="meta"><div class="t" id="bart">Nothing playing</div><div class="a" id="bara">Pick a song to start</div></div>
    </button>
    <div class="ctr">
      <div class="btns">
        <button class="icon" id="shuf" aria-label="Shuffle"></button>
        <button class="icon" id="prev" aria-label="Previous"></button>
        <button class="pp" id="pp" aria-label="Play"></button>
        <button class="icon" id="next" aria-label="Next"></button>
        <button class="icon" id="rep" aria-label="Repeat"></button>
      </div>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek"><span id="tot">0:00</span></div>
    </div>
    <div class="right">
      <div class="seg" id="barmode"></div>
      <button class="icon" id="expand" aria-label="Now playing"></button>
    </div>
  </footer>
</div>
<input type="file" id="file" accept="video/*,audio/*,.mp4,.mov,.m4v,.mp3,.m4a,.wav,.aac" multiple hidden>
<input type="file" id="linkfile" accept="video/*,audio/*,.mp4,.mov,.m4v,.mp3,.m4a,.wav,.aac" hidden>
<input type="file" id="csv" accept=".csv,text/csv,text/plain" hidden>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  lib: sv('<path d="M4 4v16M9 4v16M14 5l5 15"/>'),
  vid: sv('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'),
  pls: sv('<path d="M4 6h12M4 12h12M4 18h7"/><circle cx="17" cy="17" r="3"/><path d="M20 17V8"/>'),
  imp: sv('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/>'),
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg>',
  prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12z M6 5h2v14H6z" fill="currentColor"/></svg>',
  next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7z M16 5h2v14h-2z" fill="currentColor"/></svg>',
  shuf: sv('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),
  rep: sv('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  more: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>',
  up: sv('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  expand: sv('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  add: sv('<path d="M12 5v14M5 12h14"/>'),
  trash: sv('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>'),
  link: sv('<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>'),
};

/* ---------- storage ---------- */
let db = null;
function openDB() {

function wav(buf) {
  const d = buf.getChannelData(0), n = d.length, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
  return new Blob([b], { type: 'audio/wav' });
}
async function makeDemos() {
  const specs = [
    { title: 'Harbor Lights', root: 57, bpm: 100, prog: [[0, 4, 7], [-3, 0, 4], [5, 9, 12], [7, 11, 14]], hues: [172, 215] },
    { title: 'Paper Planes', root: 60, bpm: 120, prog: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]], hues: [38, 340] },
    { title: 'Night Bus', root: 55, bpm: 84, prog: [[0, 3, 7], [8, 12, 15], [3, 7, 10], [10, 14, 17]], hues: [255, 195] },
  ];
  // Show placeholders right away, render audio afterwards.
  S.demos = specs.map((s, i) => ({ id: 'demo-' + i, title: s.title, artist: 'Flipside Examples', album: 'Examples', kind: 'audio', mode: 'song', blob: new Blob([], { type: 'audio/wav' }), thumb: genArt(s.title, s.hues), duration: 0, demo: true }));
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  for (let k = 0; k < specs.length; k++) {
    const sp = specs[k];
    try {
      const sr = 22050, beat = 60 / sp.bpm, bars = 8, len = bars * 4 * beat + .5;
      const ctx = new OAC(1, Math.ceil(sr * len), sr);
      const master = ctx.createGain(); master.gain.value = .22; master.connect(ctx.destination);
      const note = (type, f, t, dur, peak) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02); };
      for (let bar = 0; bar < bars; bar++) {
        const ch = sp.prog[bar % 4], t0 = bar * 4 * beat;
        note('sine', hz(sp.root - 12 + ch[0]), t0, 4 * beat - .05, .9);
        note('sine', hz(sp.root - 12 + ch[0]), t0 + 2 * beat, 2 * beat - .05, .5);
        for (let s = 0; s < 8; s++) note('triangle', hz(sp.root + ch[s % 3] + (s >= 4 ? 12 : 0)), t0 + s * beat / 2, beat / 2 * .9, .45);
        if (bar >= 4) for (let s = 0; s < 4; s++) note('square', hz(sp.root + 12 + ch[(s + bar) % 3]), t0 + s * beat + beat / 4, beat / 3, .06);
      }
      const buf = await new Promise((res, rej) => { ctx.oncomplete = e => res(e.renderedBuffer); const p = ctx.startRendering(); if (p && p.then) p.then(res, rej); });
      Object.assign(S.demos[k], { blob: wav(buf), duration: len });
    } catch (e) {}
  }
  S.example = { id: 'example', name: 'Liked Songs', source: 'spotify', example: true, items: [
    { trackId: 'demo-0', title: 'Harbor Lights', artist: 'Flipside Examples', ms: 0 },
    { trackId: null, title: 'Glass Orchard', artist: 'The Low Tides', ms: 214000 },
    { trackId: 'demo-1', title: 'Paper Planes', artist: 'Flipside Examples', ms: 0 },
    { trackId: null, title: 'Slow Weather', artist: 'Mara Quill', ms: 187000 },
    { trackId: 'demo-2', title: 'Night Bus', artist: 'Flipside Examples', ms: 0 },
    { trackId: null, title: 'Static Bloom', artist: 'Hollow Coast', ms: 242000 },
  ] };
}

})();
